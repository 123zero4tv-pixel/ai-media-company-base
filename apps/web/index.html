<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Media Company — Pixel Office</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="hud">
      <div class="brand"><div class="brand-mark">◆</div><div><div class="eyebrow">AI MEDIA COMPANY</div><h1>PIXEL OFFICE</h1></div></div>
      <div class="hud-center"><span class="live-dot"></span> COMPANY ONLINE <span id="clock"></span></div>
      <div class="hud-actions"><button class="hud-btn" id="tasksBtn">TASKS <b id="taskBadge">3</b></button><button class="hud-btn" id="approvalBtn">⚠ APPROVAL <b>1</b></button></div>
    </header>

    <main class="office-wrap">
      <div class="office-stage" id="officeStage">
        <div class="office-title"><span>DAY 01</span><strong>COMPANY FLOOR</strong></div>
        <div class="iso-floor"></div>
        <div class="rooms" id="rooms"></div>
        <div class="office-footer"><span>CLICK AN AI EMPLOYEE TO INSPECT</span><span>DRAG / SCROLL TO EXPLORE</span></div>
      </div>

      <aside class="side-panel" id="sidePanel">
        <div class="panel-top"><span class="panel-label">COMPANY CORE</span><button id="closePanel">×</button></div>
        <div id="panelContent"></div>
      </aside>
    </main>

    <nav class="bottom-hud">
      <button class="nav-btn active" data-view="office">🏢 <span>OFFICE</span></button>
      <button class="nav-btn" data-view="tasks">📋 <span>TASKS</span></button>
      <button class="nav-btn" data-view="pipeline">🔄 <span>PIPELINE</span></button>
      <button class="nav-btn" data-view="activity">◉ <span>ACTIVITY</span></button>
      <button class="nav-btn" data-view="llm">⚙ <span>AI CORE</span></button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
